plugins {
	// Ab Minecraft 26.1 ist Minecraft nicht mehr obfuskiert -> "No-Remap"-Loom.
	// TODO: Plugin-ID gegen die aktuelle Fabric-Beispielmod-Vorlage pruefen
	//       (https://github.com/FabricMC/fabric-example-mod). Falls sie abweicht, dort uebernehmen.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Hier nur Repos fuer andere Mods eintragen, Loom bringt die Minecraft-Repos selbst mit.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// WICHTIG: Keine "mappings"-Zeile mehr (kein Yarn, keine Mojmap-Layer noetig),
	// und "implementation" statt "modImplementation".
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25 // Minecraft 26.x benoetigt Java 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
